<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Random Password Generator</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <h1>Generate a </br><span id="text-highlight">random password</span></h1>
        <div>
            <h3>Never use an unsecure password again.</h3>
            <p>Choose password length:</P>
                <div class="slidecontainer">
                    <input type="range" min="1" max="30" value="15" class="slider" id="myRange" />
                </div>
            <p id="password-length">Password length: </p>
            <div class="content">
                <button id="generate">Generate password</button>
                <hr>
                <div class="passwords">
                    <p id="password" class="passwordField"></p>
                </div>
            </div>
        </div>
        
         <script src="index.js"></script>
    </body>
</html>
